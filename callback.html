<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dark-yt callback</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
    pre { background: #f2f2f2; padding: 12px; border-radius: 6px; word-break: break-all; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Autorização recebida</h1>
  <p>Copie o código abaixo e cole no terminal onde o comando <code>pipeline auth-tiktok</code> está esperando:</p>
  <pre id="c"></pre>
  <p id="e" style="color:#b00"></p>
  <script>
    var q = new URLSearchParams(location.search);
    document.getElementById('c').textContent = q.get('code') || '(sem código na URL)';
    if (q.get('error')) {
      document.getElementById('e').textContent = 'Erro: ' + q.get('error') + ' - ' + (q.get('error_description') || '');
    }
  </script>
</body>
</html>
